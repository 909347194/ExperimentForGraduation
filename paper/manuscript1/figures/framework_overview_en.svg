<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" font-family="Microsoft YaHei, SimHei, sans-serif">
<rect width="1400" height="700" fill="white"/>
<marker id="mD" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#4A4A4A"/></marker>
<marker id="mR" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#C0392B"/></marker>
<marker id="mG" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#666666"/></marker>
<marker id="mO" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#C2582B"/></marker>
<rect x="60" y="45" width="280" height="110" rx="10" fill="#EEF5EF" stroke="#3A7D44" stroke-width="1.6"/>
<text x="72" y="69" font-size="13" fill="#1A1A1A" font-weight="bold">Task arrival stream</text>
<text x="72" y="92" font-size="11.5" fill="#1A1A1A">· scheduled arrivals (continuous flow)</text>
<text x="72" y="114" font-size="11.5" fill="#1A1A1A">· sudden high-priority tasks</text>
<text x="72" y="136" font-size="11.5" fill="#1A1A1A">· fault-released tasks</text>
<polyline points="340,100 378,100" fill="none" stroke="#4A4A4A" stroke-width="1.7" marker-end="url(#mD)"/>
<rect x="380" y="45" width="280" height="110" rx="10" fill="#EEF5EF" stroke="#3A7D44" stroke-width="1.6"/>
<text x="392" y="69" font-size="13" fill="#1A1A1A" font-weight="bold">Dynamic task pool T<tspan font-size="9" dy="3">t</tspan></text>
<text x="392" y="92" font-size="11.5" fill="#1A1A1A">candidate → enter solving</text>
<text x="392" y="114" font-size="11.5" fill="#1A1A1A">retained: aging, anti-starvation</text>
<text x="392" y="136" font-size="11.5" fill="#1A1A1A">exit: permanently unreachable</text>
<text x="505" y="176" font-size="10.5" fill="#555555" text-anchor="end">serving vs. deferring is itself a decision</text>
<rect x="700" y="45" width="280" height="110" rx="10" fill="#F4F4F4" stroke="#595959" stroke-width="1.6"/>
<text x="712" y="69" font-size="13" fill="#1A1A1A" font-weight="bold">Fleet state U<tspan font-size="9" dy="3">t</tspan></text>
<text x="712" y="92" font-size="11.5" fill="#1A1A1A">position · range · charging / fault</text>
<text x="712" y="114" font-size="11.5" fill="#1A1A1A">heterogeneous speed / range / endurance</text>
<polyline points="520,155 520,188" fill="none" stroke="#4A4A4A" stroke-width="1.7" marker-end="url(#mD)"/>
<polyline points="840,155 840,188" fill="none" stroke="#4A4A4A" stroke-width="1.7" marker-end="url(#mD)"/>
<rect x="60" y="190" width="920" height="170" rx="10" fill="#EAF1FA" stroke="#2E5C8A" stroke-width="1.6"/>
<text x="80" y="216" font-size="14" fill="#2E5C8A" font-weight="bold">Task Allocation Layer</text>
<rect x="80" y="230" width="420" height="110" rx="8" fill="white" stroke="#2E5C8A" stroke-width="1.4"/>
<text x="92" y="254" font-size="13.5" fill="#1F4E79" font-weight="bold">Stage 1 · Task selection</text>
<text x="92" y="280" font-size="12" fill="#1A1A1A">pool ranking Pᵢ; gate nₛₑₗ = min{cap(t), n_compute}</text>
<text x="92" y="304" font-size="12" fill="#1A1A1A">event-forced inclusion bypassing ranking (guarded)</text>
<polyline points="500,285 538,285" fill="none" stroke="#4A4A4A" stroke-width="1.7" marker-end="url(#mD)"/>
<rect x="540" y="230" width="420" height="110" rx="8" fill="white" stroke="#2E5C8A" stroke-width="1.4"/>
<text x="552" y="254" font-size="13.5" fill="#1F4E79" font-weight="bold">Stage 2 · Fleet assignment and tour planning (MUAS)</text>
<text x="552" y="280" font-size="12" fill="#1A1A1A">DMDE search → decode and feasibility repair chain</text>
<text x="552" y="304" font-size="12" fill="#1A1A1A">end-nest min-cost flow → post-delivery cost polish</text>
<polyline points="480,360 480,398" fill="none" stroke="#4A4A4A" stroke-width="1.7" marker-end="url(#mD)"/>
<polyline points="560,400 560,362" fill="none" stroke="#C0392B" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#mR)"/>
<text x="575" y="376" font-size="11" fill="#333333">↓ tour plan: order π · end nest z · departure t₀ frozen · estimated cost λ·C<tspan font-size="9" dy="3">path</tspan></text>
<text x="575" y="394" font-size="11" fill="#C0392B" font-weight="bold">↑ costs rewritten by real range; infeasible legs priced out, one re-solve</text>
<rect x="60" y="400" width="920" height="170" rx="10" fill="#FCF1E7" stroke="#C2582B" stroke-width="1.6"/>
<text x="80" y="426" font-size="14" fill="#C2582B" font-weight="bold">Trajectory Planning Layer</text>
<rect x="80" y="440" width="420" height="110" rx="8" fill="white" stroke="#C2582B" stroke-width="1.4"/>
<text x="92" y="464" font-size="13.5" fill="#8C3D1D" font-weight="bold">Single-UAV layer · spatio-temporal coupling</text>
<text x="92" y="490" font-size="12" fill="#1A1A1A">corridor constraint + RRT initial guesses</text>
<text x="92" y="514" font-size="12" fill="#1A1A1A">joint optimization min ΣΔt over (x, v, a, Δt)</text>
<polyline points="500,475 538,475" fill="none" stroke="#4A4A4A" stroke-width="1.7" marker-end="url(#mD)"/>
<polyline points="538,515 500,515" fill="none" stroke="#C2582B" stroke-width="1.7" stroke-dasharray="5,4" marker-end="url(#mO)"/>
<rect x="540" y="440" width="420" height="110" rx="8" fill="white" stroke="#C2582B" stroke-width="1.4"/>
<text x="552" y="464" font-size="13.5" fill="#8C3D1D" font-weight="bold">Multi-UAV coordination · spatio-temporal decoupling</text>
<text x="552" y="490" font-size="12" fill="#1A1A1A">CPA conflict detection → geometric detour (t₀ frozen)</text>
<text x="552" y="514" font-size="12" fill="#1A1A1A">geometry change ⇒ time re-solved (back to single-UAV)</text>
<text x="960" y="562" font-size="11" fill="#8C3D1D" text-anchor="end">delivery criterion: full-domain clearance re-check</text>
<polyline points="520,570 520,608" fill="none" stroke="#4A4A4A" stroke-width="1.7" marker-end="url(#mD)"/>
<text x="532" y="594" font-size="11.5" fill="#333333">time-stamped trajectory (geometry + time profile)</text>
<rect x="60" y="610" width="920" height="44" rx="8" fill="#EFEFEF" stroke="#8C8C8C" stroke-width="1.4"/>
<text x="520" y="638" font-size="12.5" fill="#1A1A1A" text-anchor="middle">cycle settlement (t → t+1): occupancy accounting · overrun check · pruning</text>
<rect x="1100" y="180" width="280" height="150" rx="8" fill="#F4F4F4" stroke="#595959" stroke-width="1.6"/>
<text x="1112" y="204" font-size="13" fill="#1A1A1A" font-weight="bold">Rolling horizon: cycles + events</text>
<text x="1112" y="228" font-size="11.5" fill="#1A1A1A">decide → execute → settle per cycle</text>
<text x="1112" y="250" font-size="11.5" fill="#1A1A1A">edge-triggered events at boundaries:</text>
<text x="1112" y="272" font-size="11.5" fill="#1A1A1A">fault · urgent task · nest unavailable</text>
<text x="1112" y="294" font-size="11.5" fill="#1A1A1A">→ re-pool / force-in / exclude nests</text>
<polyline points="1100,255 984,255" fill="none" stroke="#666666" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#mG)"/>
<polyline points="980,632 1030,632 1030,300 984,300" fill="none" stroke="#C0392B" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#mR)"/>
<text x="1000" y="676" font-size="11.5" fill="#C0392B" font-weight="bold">cross-cycle feedback: unresolved legs and tasks re-pool next cycle</text>
</svg>