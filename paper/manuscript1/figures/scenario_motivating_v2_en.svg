<svg width="100%" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Motivating scenario for multi-UAV cooperation in urban low-altitude airspace (v2)</title>
<desc>Urban low-altitude scene: three bases, buildings and a no-fly zone; tasks arrive continuously (dashed arrow to newly arrived task T7). Each of the three cross-base tours serves tasks: U1 visits T1 then T2 from B1 (detouring around a building, with departure and arrival times marked) and lands at B3; U2 serves T3 from B2 and lands at B3; U3 serves T4 from B3 and lands at B2. Tours U2 and U3 keep a minimum separation, reflecting timed collision-free trajectories.</desc>
<defs>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#C2571A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Legend -->
<g font-family="var(--font-sans)" font-size="12">
  <g transform="translate(66 30)">
    <path d="M-11 1A11 5.5 0 0 0 11 1L11 4A11 5.5 0 0 1 -11 4Z" fill="#8FA0B0"/>
    <ellipse rx="11" ry="5.5" fill="#E4ECF4" stroke="#4A5A6A" stroke-width="0.8"/>
    <path d="M-3 -2L-3 2M3 -2L3 2M-3 0L3 0" stroke="#23384A" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="-9.5" cy="-1.8" r="0.9" fill="#F2B134"/><circle cx="9.5" cy="-1.8" r="0.9" fill="#F2B134"/>
  </g>
  <text x="82" y="34" fill="#2C2C2A">Base</text>
  <g transform="translate(152 30)" stroke="#2F4F6F" stroke-width="1">
    <path d="M-3 -2L-7 -5M3 -2L7 -5M-3 2L-7 5M3 2L7 5"/>
    <ellipse cx="-7" cy="-5" rx="3.5" ry="1.8" fill="#C6DFF3" stroke="#185FA5" stroke-width="0.6"/>
    <ellipse cx="7" cy="-5" rx="3.5" ry="1.8" fill="#C6DFF3" stroke="#185FA5" stroke-width="0.6"/>
    <ellipse cx="-7" cy="5" rx="3.5" ry="1.8" fill="#C6DFF3" stroke="#185FA5" stroke-width="0.6"/>
    <ellipse cx="7" cy="5" rx="3.5" ry="1.8" fill="#C6DFF3" stroke="#185FA5" stroke-width="0.6"/>
    <rect x="-4.5" y="-3" width="9" height="6" rx="2.5" fill="#2F4F6F" stroke="#173247" stroke-width="0.6"/>
  </g>
  <text x="176" y="34" fill="#2C2C2A">UAV</text>
  <line x1="236" y1="30" x2="266" y2="30" stroke="#185FA5" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="274" y="34" fill="#042C53">Assigned tour</text>
  <ellipse cx="435" cy="30" rx="10" ry="5" fill="#F09595" fill-opacity="0.5" stroke="#A32D2D" stroke-width="0.8" stroke-dasharray="3 2"/>
  <text x="450" y="34" fill="#791F1F">No-fly zone</text>
  <line x1="560" y1="30" x2="585" y2="30" stroke="#C2571A" stroke-width="1.5" marker-start="url(#arrowOrange)" marker-end="url(#arrowOrange)"/>
  <text x="592" y="34" fill="#8A3D0F">Min separation</text>

  <text x="60" y="62" fill="#2C2C2A">Task status</text>
  <g transform="translate(140 58)"><path d="M0 0L0 -14" stroke="#3B6D11" fill="none"/><path d="M0 -14L11 -10.5L0 -7Z" fill="#97C459" stroke="#3B6D11" stroke-width="0.7"/></g>
  <text x="150" y="62" fill="#27500A">Done</text>
  <g transform="translate(205 58)"><path d="M0 0L0 -14" stroke="#185FA5" fill="none"/><path d="M0 -14L11 -10.5L0 -7Z" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.7"/></g>
  <text x="215" y="62" fill="#042C53">Executing</text>
  <g transform="translate(280 58)"><path d="M0 0L0 -14" stroke="#A86C00" fill="none"/><path d="M0 -14L11 -10.5L0 -7Z" fill="#F2C25E" stroke="#A86C00" stroke-width="0.7"/></g>
  <text x="290" y="62" fill="#6B4700">Pending</text>
  <g transform="translate(355 58)"><path d="M0 0L0 -14" stroke="#A32D2D" fill="none"/><path d="M0 -14L11 -10.5L0 -7Z" fill="#F09595" stroke="#A32D2D" stroke-width="0.7"/></g>
  <text x="365" y="62" fill="#791F1F">Unreachable</text>
  <line x1="430" y1="58" x2="458" y2="58" stroke="#5F5E5A" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>
  <text x="464" y="62" fill="#5F5E5A">Task arrival</text>
</g>

<!-- Isometric ground grid -->
<path d="M50 315L340 95L670 245L370 435Z" fill="#F1EFE8" fill-opacity="0.55" stroke="#B4B2A9" stroke-width="0.8"/>
<g stroke="#D3D1C7" stroke-width="0.7">
  <path d="M86.25 287.5L406.25 407.5M122.5 260L442.5 380M158.75 232.5L478.75 352.5M195 205L515 325M231.25 177.5L551.25 297.5M267.5 150L587.5 270M303.75 122.5L623.75 242.5"/>
  <path d="M90 330L380 110M130 345L420 125M170 360L460 140M210 375L500 155M250 390L540 170M290 405L580 185M330 420L620 200"/>
</g>

<!-- Buildings (source of 3D cost); tour U1 detours around one of them -->
<path d="M234 202L254 190L274 202L254 214Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<path d="M234 202L254 214L254 260L234 248Z" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5"/>
<path d="M254 214L274 202L274 248L254 260Z" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<path d="M324 199L339 190L354 199L339 208Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<path d="M324 199L339 208L339 229L324 220Z" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5"/>
<path d="M339 208L354 199L354 220L339 229Z" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<path d="M285 145L302 136L320 145L302 154Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<path d="M285 145L302 154L302 190L285 181Z" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5"/>
<path d="M302 154L320 145L320 181L302 190Z" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<path d="M305 285L322 275L339 285L322 295Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<path d="M305 285L322 295L322 335L305 325Z" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5"/>
<path d="M322 295L339 285L339 325L322 335Z" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>

<!-- No-fly zone: encloses only unreachable task T6; all tours skirt around it -->
<ellipse cx="392" cy="265" rx="45" ry="26" fill="#F09595" fill-opacity="0.35" stroke="#A32D2D" stroke-width="0.8" stroke-dasharray="4 3"/>
<ellipse cx="392" cy="265" rx="27" ry="15" fill="none" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="350" y="244" text-anchor="middle" font-family="var(--font-sans)" font-size="12" fill="#791F1F">No-fly zone</text>

<!-- Assigned tours (timed trajectories): U1 visits T1 then T2 around the building and lands at B3; U2 serves T3 right of the no-fly zone and lands at B3; U3 serves T4 from B3 and lands at B2. None crosses the no-fly zone -->
<g fill="none" stroke="#185FA5" stroke-width="1.8" marker-end="url(#arrowBlue)">
  <path d="M145 305Q200 311 250 315Q280 322 305 342Q322 360 348 350Q410 322 470 305"/>
  <path d="M350 155Q385 188 425 228Q500 248 470 305"/>
  <path d="M470 305Q535 290 545 225Q505 155 350 155"/>
</g>

<!-- Minimum separation between tours U2 and U3 (collision-free constraint) -->
<line x1="478" y1="269" x2="502" y2="292" stroke="#C2571A" stroke-width="1.4" marker-start="url(#arrowOrange)" marker-end="url(#arrowOrange)"/>
<text x="496" y="254" text-anchor="middle" font-family="var(--font-sans)" font-size="10" font-style="italic" fill="#8A3D0F">d<tspan baseline-shift="sub" font-size="7">min</tspan></text>

<!-- Time marks for tour U1: frozen departure time t0; t1 and t2 are the ETAs at T1 and T2, showing the visit order -->
  <text x="176" y="296" font-family="var(--font-sans)" font-size="10" font-style="italic" fill="#5F5E5A">t<tspan baseline-shift="sub" font-size="7">0</tspan></text>
  <text x="272" y="304" font-family="var(--font-sans)" font-size="10" font-style="italic" fill="#5F5E5A">t<tspan baseline-shift="sub" font-size="7">1</tspan></text>
  <text x="427" y="300" font-family="var(--font-sans)" font-size="10" font-style="italic" fill="#5F5E5A">t<tspan baseline-shift="sub" font-size="7">2</tspan></text>

<!-- Bases: raised helipad with H mark and corner lights -->
<g transform="translate(145 305)">
  <path d="M-17 1A17 8.5 0 0 0 17 1L17 6A17 8.5 0 0 1 -17 6Z" fill="#8FA0B0"/>
  <ellipse rx="17" ry="8.5" fill="#E4ECF4" stroke="#4A5A6A" stroke-width="1"/>
  <ellipse rx="12" ry="6" fill="none" stroke="#7C8D9E" stroke-width="0.9" stroke-dasharray="3 2.5"/>
  <path d="M-5 -3L-5 3M5 -3L5 3M-5 0L5 0" stroke="#23384A" stroke-width="2" stroke-linecap="round"/>
  <circle cx="-15" cy="-2.5" r="1.3" fill="#F2B134"/><circle cx="15" cy="-2.5" r="1.3" fill="#F2B134"/>
  <text x="0" y="-13" text-anchor="middle" font-family="var(--font-sans)" font-size="12" fill="#23384A">B1</text>
</g>
<g transform="translate(350 155)">
  <path d="M-17 1A17 8.5 0 0 0 17 1L17 6A17 8.5 0 0 1 -17 6Z" fill="#8FA0B0"/>
  <ellipse rx="17" ry="8.5" fill="#E4ECF4" stroke="#4A5A6A" stroke-width="1"/>
  <ellipse rx="12" ry="6" fill="none" stroke="#7C8D9E" stroke-width="0.9" stroke-dasharray="3 2.5"/>
  <path d="M-5 -3L-5 3M5 -3L5 3M-5 0L5 0" stroke="#23384A" stroke-width="2" stroke-linecap="round"/>
  <circle cx="-15" cy="-2.5" r="1.3" fill="#F2B134"/><circle cx="15" cy="-2.5" r="1.3" fill="#F2B134"/>
  <text x="0" y="-13" text-anchor="middle" font-family="var(--font-sans)" font-size="12" fill="#23384A">B2</text>
</g>
<g transform="translate(470 305)">
  <path d="M-17 1A17 8.5 0 0 0 17 1L17 6A17 8.5 0 0 1 -17 6Z" fill="#8FA0B0"/>
  <ellipse rx="17" ry="8.5" fill="#E4ECF4" stroke="#4A5A6A" stroke-width="1"/>
  <ellipse rx="12" ry="6" fill="none" stroke="#7C8D9E" stroke-width="0.9" stroke-dasharray="3 2.5"/>
  <path d="M-5 -3L-5 3M5 -3L5 3M-5 0L5 0" stroke="#23384A" stroke-width="2" stroke-linecap="round"/>
  <circle cx="-15" cy="-2.5" r="1.3" fill="#F2B134"/><circle cx="15" cy="-2.5" r="1.3" fill="#F2B134"/>
  <text x="0" y="-13" text-anchor="middle" font-family="var(--font-sans)" font-size="12" fill="#23384A">B3</text>
</g>

<!-- Task points: color-coded states. T1-T4 (executing) lie on tours with visit order matching the trajectory direction; done/newly-arrived/unreachable are off-tour -->
<g font-family="var(--font-sans)" font-size="12">
  <g transform="translate(250 315)" stroke="#185FA5" stroke-width="1">
    <path d="M0 0L0 -18" fill="none"/><path d="M0 -18L13 -14L0 -10Z" fill="#B5D4F4"/>
    <text x="0" y="13" text-anchor="middle" stroke="none" fill="#042C53">T1</text>
  </g>
  <!-- T2 executing (second visit of U1) -->
  <g transform="translate(409 325)" stroke="#185FA5" stroke-width="1">
    <path d="M0 0L0 -18" fill="none"/><path d="M0 -18L13 -14L0 -10Z" fill="#B5D4F4"/>
    <text x="0" y="13" text-anchor="middle" stroke="none" fill="#042C53">T2</text>
  </g>
  <!-- T3 executing (U2); flag points left to clear the U2 battery bar -->
  <g transform="translate(425 228)" stroke="#185FA5" stroke-width="1">
    <path d="M0 0L0 -18" fill="none"/><path d="M0 -18L-13 -14L0 -10Z" fill="#B5D4F4"/>
    <text x="0" y="13" text-anchor="middle" stroke="none" fill="#042C53">T3</text>
  </g>
  <!-- T5 done (served by an earlier sortie, out of pool) -->
  <g transform="translate(200 210)" stroke="#3B6D11" stroke-width="1">
    <path d="M0 0L0 -18" fill="none"/><path d="M0 -18L13 -14L0 -10Z" fill="#97C459"/>
    <text x="0" y="13" text-anchor="middle" stroke="none" fill="#27500A">T5</text>
  </g>
  <!-- T7 newly arrived, pending (no UAV available this cycle, stays in pool) -->
  <g transform="translate(560 290)" stroke="#A86C00" stroke-width="1">
    <path d="M0 0L0 -18" fill="none"/><path d="M0 -18L13 -14L0 -10Z" fill="#F2C25E"/>
    <text x="0" y="13" text-anchor="middle" stroke="none" fill="#6B4700">T7</text>
  </g>
  <!-- T4 executing (U3) -->
  <g transform="translate(545 225)" stroke="#185FA5" stroke-width="1">
    <path d="M0 0L0 -18" fill="none"/><path d="M0 -18L13 -14L0 -10Z" fill="#B5D4F4"/>
    <text x="0" y="13" text-anchor="middle" stroke="none" fill="#042C53">T4</text>
  </g>
  <g transform="translate(392 268)" stroke="#A32D2D" stroke-width="1">
    <path d="M0 0L0 -18" fill="none"/><path d="M0 -18L13 -14L0 -10Z" fill="#F09595"/>
    <path d="M3 -16L9 -12M9 -16L3 -12" fill="none" stroke-width="0.9"/>
    <text x="0" y="13" text-anchor="middle" stroke="none" fill="#791F1F">T6</text>
  </g>
</g>

<!-- Newly arriving task T7 flows in from outside the scene; task IDs follow arrival order, the newest has the largest ID -->
<path d="M655 298L582 291" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>

<!-- Quadrotors: body, arms, four rotors, landing gear, battery, cross-base takeoff/landing -->
<g transform="translate(225 313)" stroke="#2F4F6F" stroke-width="1">
