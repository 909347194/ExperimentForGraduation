  <circle cx="-11" cy="-8" r="1.2" fill="#185FA5"/><circle cx="11" cy="-8" r="1.2" fill="#185FA5"/>
  <circle cx="-11" cy="8" r="1.2" fill="#185FA5"/><circle cx="11" cy="8" r="1.2" fill="#185FA5"/>
  <rect x="-7" y="-4.5" width="14" height="9" rx="3.5" fill="#2F4F6F" stroke="#173247" stroke-width="0.8"/>
  <circle r="2" fill="#8FC7F0"/>
  <path d="M-4 4.5L-4.5 8M4 4.5L4.5 8" stroke="#173247" stroke-width="1"/>
  <rect x="-14" y="-35" width="28" height="9" rx="1.5" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.6"/>
  <rect x="-13" y="-34" width="16" height="7" fill="#EF9F27"/>
  <text x="0" y="-39" text-anchor="middle" font-family="var(--font-sans)" font-size="11" fill="#042C53" stroke="none">U3 70% · B3↑B2↓</text>
</g>
</svg>
