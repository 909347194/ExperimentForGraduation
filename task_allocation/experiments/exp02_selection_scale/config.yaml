experiment:
  name: exp02_selection_scale
  seed: 42
  output_dir: results
  plot_dir: plot

# 目的：在 |T_t| >> K_avail 的规模下量化第一阶段的压缩收益与代价
# （exp01_smoke 跑在机多任务少一侧，Top-αK 从不触发，无法验证该机制）

data:
  source: file
  path: nest_location_data.csv
  dem: ASTGTMV003_N29E091_dem.tif
  coordinate_column: Coordinate

problem:
  n_nests: 8
  nest_capacity: 4
  # 关键变量：可用机数固定为 8，任务规模远大于它 → |T_t| >> K_avail
  n_uavs: 8
  # 与 exp01_smoke 保持一致的模型权重（单位：收益当量 / 米）
  allow_unassigned: true
  allow_idle_uav: true
  lambda_cost: 1.0e-4
  w_penalty: 1.0
  w_nest_capacity: 1.0

# y_j 剔除规则（论文 §4.2）：λ·节省 > R^eff·(1+margin) 才剔除
stage:
  prune_unprofitable: true
  prune_max_rounds: 8
  prune_margin: 0.0
  prune_wait_bonus: 1.0
  wait_scale: 3600.0

tasks:
  source: synthetic
  spread_m: 25000.0
  reward_min: 1.0
  reward_max: 10.0
  deadline_min: 3600.0
  deadline_max: 28800.0
  anchor_to_nests: true

# 扫描的任务规模；每个规模独立测一轮（K_avail 恒为 8）
scales:
  - 50
  - 100
  - 200

selection:
  alpha: 2.5
  weights:
    w_r: 0.30
    w_u: 0.25
    w_w: 0.15
    w_s: 0.15
    w_c: 0.15
  synergy_radius: 5000.0
  wait_scale: 3600.0

# 第二阶段只对候选集求解，规模受 Top-αK 限制，用中等算力即可
solver:
  pop_size: 20
  max_generations: 60

run:
  save_results: true
  verbose: true
  # 对照实验：把 MUAS 直接跑在全量任务上（不经过第一阶段），
  # 用于量化分层省下的时间。规模上限防止跑爆。
  full_muas_baseline_scales: [50]
