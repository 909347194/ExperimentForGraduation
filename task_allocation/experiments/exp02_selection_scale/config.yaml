# exp02_selection_scale —— 单周期任务规模可扩展性台（描述性观测）
#
# 职责（唯一）：固定机队 K=6 / 场景 guangzhou / 求解预算，把单周期任务规模
#   N 扫到 10/50/100，观测第一阶段「任务选择」把进入二阶段的任务数压到多少、
#   分段墙钟与现算边数随 N 怎么变，并与「不做选择、直接对全量任务求解」的
#   同口径参照臂对比。产物是规模—耗时曲线 + 任务去向分账，全部描述性。
# 不负责：方法/档位优劣、质量高低、完成约束验收、标定口径选型、滚动到达、
#   跨实验比较、显著性。完整边界见本目录 notes.md。
#
# 口径边界（重要）：本实验是**单周期静态快照**，没有后续周期。被选择层刷掉
#   的任务既不叫「暂缓」也不叫「顺延」，一律记 remain（未完成）。因此
#   **不宣称完成约束被满足**；「完成是约束、成本是目标」由 exp01 滚动闭环检验。
#   F1 只是事后指标（门禁口径下不进搜索标量 f），落盘仅作描述性观测。
#
# 场景与机队口径：guangzhou（3 机巢 / DEM + 建筑垂直切面包络），
#   本档机队为**同构 6 架 10 km @ 15 m/s**。注意 exp01_smoke 自 2026-11-11
#   起改用了异构 10/8/6 km 清单，两实验机队口径不同 ⇒ **禁比绝对值**；
#   两臂（选择 / 参照）在本实验内部逐位同口径，横向可描述、不作归因。
#   旧 lasa_chengguan 档的 20/40/16/42 等数值一律作废。
#
# 2026-11-12 收窄职责：撤下 F1「质量」判据、补齐任务去向分账与恒等式门禁、
#   把参照臂改成单因素（同一惰性表 + 同一距离函数）、落 effective_config.json。
#   收窄前的 results/ 为冻结旧档，待正式档单独发话重跑。

experiment:
  name: exp02_selection_scale
  seed: 42
  output_dir: results
  figures_dir: results/figures
  #（清理2026-11-11：原 plot_dir 键无代码消费——图代码位置是目录约定，不走配置）

# 目的：在 |T_t| >> K_avail 的**单周期**规模下观测第一阶段对二阶段
# 搜索规模的压缩与分段墙钟（exp01_smoke 是逐周期到达的滚动任务流，
# 单周期候选池小，且负责完成约束验收，两者职责不重叠）。

data:
  scenario: guangzhou # 当前实验场景（用户裁定 2026-11-10）；场景目录 data/guangzhou/
  source: file
  path: nest_location_data.csv # 3 个机巢经纬度
  dem: dem.tif # 地面基底高程
  buildings: building # 建筑 shapefile 目录；垂直切面障碍包络 = max(地面, 地面+建筑高)，与 exp01 同口径
  region_geojson: region.geojson # 任务撒点区域多边形（广州研究区）；run.py 从本段读取
  coordinate_column: Coordinate

problem:
  n_nests: 3
  nest_capacity: 2
  # 关键变量：机队规模受 3 巢 × 容量 2 约束固定为 K=6，任务规模远大于它 → |T_t| >> K
  n_uavs: 6
  uav_speed: 15.0 # m/s（与 exp01 同值）
  # 满电航程（m）：guangzhou 生产口径 10 km。航程必须是真实瓶颈，
  # 「按机队能力标定规模」的机制才可被真正检验。
  uav_max_range: 10000.0
  uav_max_time: null # null = 派生 uav_max_range/uav_speed（与航程预算自洽，不新增淘汰）
  allow_unassigned: true
  allow_idle_uav: true
  lambda_cost: 1.0e-1 # 全实验统一 1e-1；旧档 1e-2 作废
  w_penalty: 1.0
  # 惩罚量纲解耦：秒级惩罚不再随 F2 一起乘 λ 被压没
  w_violation: 0.01
  w_nest_capacity: 1.0
  # 门禁口径（唯一主口径）：
  #   f = W_hard·n_hard + w_exc·excess_m + W_skip·n_skip + w_late·L_tot + λ·path
  #   （固定表述：搜索用 f 不含 −m·F1；F1 只作事后指标；F3 已移除）
  lexicographic: true
  big_m: null # null = 按问题数据自动推导（仅作 W_hard/W_skip 推导基数，不进 f）
  late_reward_decay_seconds: 1800.0 # 与 exp01 生产同值
  w_hard_violation: null # null = 自动 κ·m·R_pool（可行解永远压到不可行解之前）
  hard_violation_kappa: 10.0
  # 覆盖门禁：coverage_gate = 终态构造性修复；lexicographic_coverage = W_skip 罚层 + 审计分账
  lexicographic_coverage: true
  w_skip_violation: null

constraints:
  duplicate_task: true
  require_all_tasks: true
  require_no_idle: true
  range: true
  endurance: true
  time_window: true
  sequence: true
  sync: true
  nest_capacity: true
  nest_availability: true
  end_nest_reachability: true
  w_misc: 1.0
  w_range: 1.0
  w_endurance: 1.0
  w_window: 1.0
  w_seq: 1.0
  w_sync: 1.0
  w_nest_capacity: 1.0
  w_nest_availability: 1.0
  w_end_nest_reachability: 1.0

stage:
  # 选择性：字典序下经济性剔除自动关闭（丢正收益任务必降 F1），
  # 任务暂缓仅由可行性修复产生；键保留供消融对比
  prune_unprofitable: false # 与「完成是约束」冲突，门禁口径下必须关
  prune_max_rounds: 8
  prune_margin: 0.0
  prune_wait_bonus: 1.0
  wait_scale: 3600.0
  # 需求感知参与（生产口径）
  participating_policy: demand
  participation_cost: 0.0
  marginal_tour_cap: null
  demand_coverage_radius: null
  demand_range_factor: 0.5
  demand_provision_serving: true
  demand_serve_margin: 0.95
  # 「可达即执行」救援池口径：救援池扩到全可用机队
  reflow_rescue_scope: fleet
  polish_enabled: true
  polish_max_rounds: 20
  polish_max_evals: 800
  polish_eps: 1.0e-6
  coverage_gate: true
  coverage_gate_max_rounds: 8
  coverage_first: false

tasks:
  source: synthetic
  # 与 exp01 同款：广州研究区多边形内均匀撒点（需求不确定性设定）。
  # 旧档 nest_anchored + spread_m=25km 属 lasa_chengguan 大区域口径，已作废。
  domain: region
  region_geojson: region.geojson # run.py 实际从 data.region_geojson 读取；两处保持一致
  spread_m: 12000.0 # 仅 domain=nest_anchored 生效；保留占位，本档不生效
  reward_min: 1.0
  reward_max: 10.0
  deadline_min: 3600.0
  deadline_max: 28800.0
  anchor_to_nests: true

# 扫描的任务规模；每个规模独立测一轮（K 恒为 6）。
# N=10 略大于 K，N=50/100 构成 |T_t| >> K，用于观察压缩是否与 N 解耦。
scales:
  - 10
  - 50
  - 100

selection:
  alpha: 2.5
  weights:
    w_r: 0.30
    w_u: 0.25
    w_w: 0.15
    w_s: 0.15
    w_c: 0.15
  synergy_radius: 5000.0
  wait_scale: 3600.0
  # 选择封顶显式化（2026-11-12）：旧实现把 max_ratio 埋在 MarginalConfig 的
  # 代码默认 2.0 里，写成 yaml 键是「死键」（写了也静默不生效），导致
  # ⌈max_ratio·K⌉=12 这个真正的瓶颈不在 effective_config 里、无法复现核对。
  # 现在 selection_config_from() 显式读取本段；给 2.0 与旧默认逐位相同。
  # K=6 ⇒ 选择封顶 ⌈max_ratio·K⌉=12；名额族 ⌈α·K⌉=15 / 30。
  marginal:
    max_ratio: 2.0

# 给定的压缩档位（**不是待选方法，不做口径选型结论**）——
#   quota_*：纯机数名额，k = ⌈α·K⌉，与机队吞吐能力脱钩
#            （capability=intersect 只能收紧不能放宽）；
#   cap_x*：能力驱动（capability mode=primary），规模 = min(cap(t), 扩张上限)，
#           cap(t) = ⌊budget_scale·Σ remaining_range / 单任务中位代价⌋。
# 五档只是扫描自变量的不同水平，本实验不回答「哪一档更好」；
# 档位选型归 exp04 / exp06，本目录只登记各档的规模与墙钟观测。
# max_expand_factor 防 c̃ 过小时规模失控。B = 6×10 km = 60 km；
# cap(t) 实际量级由 metrics.json 的 selection.capability_cap 现算。
# 旧档「B=640 km / cap≈42 / 20/40 交错」的取点说明全部作废。
# 注意 N=10 时 N 小于全部上限，选择层不触发、五档逐位相同，
# 该规模是「未压缩」参照点，不作为档位间差异的证据。
variants:
  - name: quota_a2.5
    alpha: 2.5
    capability:
      mode: intersect
  - name: quota_a5
    alpha: 5.0
    capability:
      mode: intersect
  - name: cap_x0.25
    alpha: 2.5
    capability:
      mode: primary
      budget_scale: 0.25
      max_expand_factor: 25
  - name: cap_x0.5
    alpha: 2.5
    capability:
      mode: primary
      budget_scale: 0.5
      max_expand_factor: 25
  - name: cap_x1
    alpha: 2.5
    capability:
      mode: primary
      budget_scale: 1.0
      max_expand_factor: 25

# 第二阶段只对候选集求解；全格同预算（pop × gens 固定）。
# 但墙钟是单进程单 seed 单次观测、跨格共享 DEM 段长记忆化缓存，
# polish 评估数随收敛情况浮动 ⇒ **只描述量级，不作机制归因、不报告耗时倍数**。
solver:
  pop_size: 20
  max_generations: 40

# 出图（plot/ 只负责绘制，产物落 experiment.figures_dir）
plot:
  formats: [png] # 默认仅 PNG；render_from_json.py 可补 pdf 等矢量格式
  dpi: 300

run:
  save_results: true
  verbose: true
  # 同口径参照臂：不调用选择层，直接对全量 N 个任务建惰性矩阵并求解。
  # 与选择臂只差「是否经过第一阶段」这一件事；**不是收益上界**，
  # 只用来登记单周期墙钟的量级参照。三个规模都跑。
  full_muas_baseline_scales: [10, 50, 100]
