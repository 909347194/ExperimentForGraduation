experiment:
  name: exp02_selection_scale
  seed: 42
  output_dir: results
  figures_dir: results/figures
  plot_dir: plot

# 目的：在 |T_t| >> K_avail 的规模下量化第一阶段的压缩收益与代价
# （exp01_smoke 跑在机多任务少一侧，Top-αK 从不触发，无法验证该机制）

data:
  scenario: lasa_chengguan # 场景数据目录 data/<scenario>/（见 data/README.md）
  source: file
  path: nest_location_data.csv
  dem: Chengguan_DEM.tif
  region_geojson: Chengguan_district.geojson
  coordinate_column: Coordinate

problem:
  n_nests: 6
  nest_capacity: 4
  # 关键变量：可用机数固定为 8，任务规模远大于它 → |T_t| >> K_avail
  n_uavs: 8
  # 满电航程（m）：与 exp01 生产口径一致（城关区 20 km，2026-10-26 起）。
  # 航程必须是真实瓶颈，「按机队能力标定规模」的机制才可被真正检验。
  uav_max_range: 20000.0
  # 与 exp01 / exp05 生产口径保持一致的模型权重（单位：收益当量 / 米）
  allow_unassigned: true
  allow_idle_uav: true
  # 【2026-10-24 晚】按用户裁定统一为 1e-1，与 exp01 现行值一致；
  # 改前为 1e-2（原生产默认）。本轮全实验同口径，结果可进同一张主表。
  lambda_cost: 1.0e-1
  w_penalty: 1.0
  # 惩罚量纲解耦：秒级惩罚不再随 F2 一起乘 λ 被压没
  # （迟到 300 s ≈ 3 点奖励，足以抵消单任务收益）
  w_violation: 0.01
  w_nest_capacity: 1.0
  # 门禁口径（唯一主口径，2026-10-24）：
  #   f = W_hard·n_hard + w_exc·excess_m + W_skip·n_skip + w_late·L_tot + λ·path
  #   （固定表述：搜索用 f 不含 −m·F1；F1 只作事后指标）
  #   T0 物理违约（硬）> T0.5 覆盖门禁 > T2 迟到（秒级软计价）> T3 航程
  lexicographic: true
  big_m: null # null = 按问题数据自动推导（仅作 W_hard/W_skip 推导基数，不进 f）
  # 迟到奖励折减容忍 W（s）：晚到任务 eff = R × max(0, 1 − L/W)；
  # 与 exp01 生产同值（1800）
  late_reward_decay_seconds: 1800.0
  w_hard_violation: null # null = 自动 κ·m·R_pool（可行解永远压到不可行解之前）
  hard_violation_kappa: 10.0
  # 覆盖门禁（唯一主口径，与 exp01 生产口径一致；见
  # docs/objective_caliber_two_approaches_archive_2026-10-24.md）：
  #   coverage_gate = 终态构造性修复；lexicographic_coverage = W_skip 罚层 + 审计分账
  lexicographic_coverage: true
  w_skip_violation: null

constraints:
  duplicate_task: true
  require_all_tasks: true
  require_no_idle: true
  range: true
  endurance: true
  time_window: true
  sequence: true
  sync: true
  nest_capacity: true
  nest_availability: true
  end_nest_reachability: true
  w_misc: 1.0
  w_range: 1.0
  w_endurance: 1.0
  w_window: 1.0
  w_seq: 1.0
  w_sync: 1.0
  w_nest_capacity: 1.0
  w_nest_availability: 1.0
  w_end_nest_reachability: 1.0

stage:
  # 选择性：字典序下经济性剔除自动关闭（丢正收益任务必降 F1），
  # 任务暂缓仅由可行性修复产生；键保留供消融对比
  prune_unprofitable: false  # 与「完成是约束」冲突，门禁口径下必须关
  prune_max_rounds: 8
  prune_margin: 0.0
  prune_wait_bonus: 1.0
  wait_scale: 3600.0
  # 需求感知参与（生产口径）：贪心最大覆盖选参与机，
  # 再按航程预算容量感知补机（治 K 塌缩 → 远任务未服务）
  participating_policy: demand
  participation_cost: 0.0
  marginal_tour_cap: null
  demand_coverage_radius: null
  demand_range_factor: 0.5
  demand_provision_serving: true
  demand_serve_margin: 0.95
  # 「可达即执行」救援池口径：救援池扩到全可用机队（存在量化）
  reflow_rescue_scope: fleet
  polish_enabled: true
  polish_max_rounds: 20
  polish_max_evals: 800
  polish_eps: 1.0e-6
  # 覆盖门禁两层（默认关，与生产口径一致；消融时两开关同开 = 完整门禁口径）
  coverage_gate: true
  coverage_gate_max_rounds: 8
  coverage_first: false

tasks:
  source: synthetic
  # 撒点域：exp02 为「规模可扩展性」实验，沿用锚定机巢口径；
  # 全域撒点（dem_extent）是 exp01 的需求不确定性设定
  domain: nest_anchored
  spread_m: 25000.0
  reward_min: 1.0
  reward_max: 10.0
  deadline_min: 3600.0
  deadline_max: 28800.0
  anchor_to_nests: true

# 扫描的任务规模；每个规模独立测一轮（K_avail 恒为 8）
scales:
  - 10
  - 50
  - 100

selection:
  alpha: 2.5
  weights:
    w_r: 0.30
    w_u: 0.25
    w_w: 0.15
    w_s: 0.15
    w_c: 0.15
  synergy_radius: 5000.0
  wait_scale: 3600.0

# 规模标定扫描：候选/选择规模政策 × 能力预算系数。两族对照——
#   quota_*：纯机数名额，k = ⌈α·K⌉，与机队吞吐能力脱钩
#            （capability=intersect 只能收紧不能放宽）；
#   cap_x*：能力驱动（capability mode=primary），规模 = min(cap(t), 扩张上限)，
#           cap(t) = ⌊budget_scale·Σ remaining_range / 单任务中位代价⌋
#           —— 跟着机队总吞吐走。
# max_expand_factor 防 c̃ 过小时规模失控（相对机数名额的扩张倍数上限）。
# 取点：B = 8×80km = 640km、任务中位代价 ~15km ⇒ cap(×1.0)≈42；变点取
# 0.25/0.5/1.0 ⇒ cap≈10/21/42，与机数名额 20/40 交错形成对照曲线；
# 其中 quota_a5(40) 与 cap_x1(42) 近似等规模，可直接对比「同规模下
# 两种标定口径的选择质量」。cap(t)≈80/128 等更右端取点与相邻点曲线形状
# 重复，不入矩阵；不压缩极点由 full_baseline 承担。
variants:
  - name: quota_a2.5
    alpha: 2.5
    capability:
      mode: intersect
  - name: quota_a5
    alpha: 5.0
    capability:
      mode: intersect
  - name: cap_x0.25
    alpha: 2.5
    capability:
      mode: primary
      budget_scale: 0.25
      max_expand_factor: 25
  - name: cap_x0.5
    alpha: 2.5
    capability:
      mode: primary
      budget_scale: 0.5
      max_expand_factor: 25
  - name: cap_x1
    alpha: 2.5
    capability:
      mode: primary
      budget_scale: 1.0
      max_expand_factor: 25

# 第二阶段只对候选集求解，规模受候选上限限制，用中等算力即可。
# exp02 量的是「吞吐-耗时-质量」权衡曲线的形状，不是生产级解质量
# （那由 exp01 以 100 代 + 2000 评估的口径给出）；全格同预算，横向可比。
solver:
  pop_size: 20
  max_generations: 40

# 出图（plot/ 只负责绘制，产物落 experiment.figures_dir）
plot:
  formats: [png] # 默认仅 PNG；render_from_json.py 可补 pdf 等矢量格式
  dpi: 300

run:
  save_results: true
  verbose: true
  # 对照实验：把 MUAS 直接跑在全量任务上（不经过第一阶段），
  # 用作每个规模的质量上界与耗时参照。三个规模都跑。
  full_muas_baseline_scales: [10, 50, 100]
