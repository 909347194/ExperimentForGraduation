# exp03_event_rolling —— 动态滚动场景下的适应性分析（论文 §3.5.6）
#
# 验证方法对动态事件（UAV 故障 / 突发高优先级任务 / 机巢不可用）的响应。
# 因子 E0..E4：无事件 / UAV 故障 / 突发高优 / 机巢闭塞 / 组合。
# 注入周期统一 t=6（E4 双注入 t=6,10）。

experiment:
    name: exp03_event_rolling
    seed: 42
    seeds: [42, 43, 44]
    output_dir: results
    figures_dir: results/figures

data:
    scenario: guangzhou
    source: file
    path: nest_location_data.csv
    dem: null                 # DEM 数据不在 git（大二进制），置 null 用平面地形
    buildings: null           # 建筑数据同理，置 null
    coordinate_column: Coordinate

problem:
    fleet_file: uav_config.json
    n_nests: 3
    nest_capacity: 2
    n_uavs: 6
    uav_speed: 15.0
    uav_max_range: 10000.0
    uav_max_time: null

tasks:
    domain: region
    region_geojson: region.geojson
    dem_inset_m: 0.0
    max_reject_trials: 8
    n_tasks: 12                # 周期 1 初始任务数（比 exp01 少，配合 Poisson 流）
    spread_m: 12000.0
    sequence_chain_ratio: 0.0
    sequence_chain_len: 2
    reward_min: 1.0
    reward_max: 10.0
    deadline_cycles_min: 2.0
    deadline_cycles_max: 4.0

selection:
    alpha: 2.5
    weights:
        w_r: 0.30
        w_u: 0.25
        w_w: 0.15
        w_s: 0.15
        w_c: 0.15
    synergy_radius: 5000.0
    wait_scale: 3600.0
    feasibility:
        range_margin: 1.0
        check_time_window: false
        budget_factor: 1.0
        late_tolerance_seconds: 1800.0
    marginal:
        eps: 1.0
        max_selected: null
        max_ratio: 4.0
        min_marginal_ratio: 0.0
        age_gamma: 1.0
        wait_scale: 3600.0
    capability:
        enabled: true
        mode: intersect
        max_expand_factor: null
        budget_scale: 1.0
        quantile: 0.5
        min_cap: 1
        fallback_when_disabled: false
    anti_starvation:
        enabled: true
        force_after_seconds: 1200.0
        deadline_slack: 300.0

muas:
    allow_unassigned: true
    allow_idle_uav: true
    big_m: null
    lambda_cost: 1.0e-1
    w_penalty: 1.0
    w_violation: 0.01
    w_hard_violation: null
    w_range_excess: null
    hard_violation_kappa: 10.0
    late_reward_decay_seconds: 1800.0
    default_service_time: 60.0
    max_participating_uavs: null
    participating_policy: demand
    demand_coverage_radius: null
    demand_range_factor: 0.5
    demand_provision_serving: true
    demand_serve_margin: 0.95
    reflow_rescue_scope: fleet
    sortie_budget: null
    participation_cost: 0.0
    marginal_tour_cap: null
    prune_unprofitable: false
    prune_margin: 0.0
    prune_max_rounds: 8
    prune_zero_reward: false
    prune_wait_bonus: 1.0
    wait_scale: 3600.0
    lamarckian: true
    polish_enabled: true
    polish_moves: [relocate, swap, position]
    polish_max_rounds: 30
    polish_max_evals: 2000
    polish_eps: 1.0e-6
    decode_mode: repair_chain
    coverage_gate: true
    coverage_gate_max_rounds: 8
    coverage_audit: true
    w_skip_violation: null
    coverage_first: false
    coverage_first_max_rounds: 4
    monotone_polish_max_rounds: 30
    monotone_polish_eps: 1.0e-6
    reorder_range_optimize: false
    reorder_range_eps: 1.0
    cost_polish_enabled: true
    cost_polish_max_rounds: 30
    cost_polish_eps: 1.0
    cost_polish_relocate_enabled: true
    polish_in_loop: false
    memetic_K: 20
    memetic_max_rounds: 6
    memetic_max_evals: 500

constraints:
    duplicate_task: true
    require_all_tasks: true
    require_no_idle: true
    range: true
    endurance: true
    time_window: true
    sequence: true
    sync: true
    nest_capacity: true
    nest_availability: true
    end_nest_reachability: true
    w_misc: 1.0
    w_range: 1.0
    w_endurance: 1.0
    w_window: 1.0
    w_seq: 1.0
    w_sync: 1.0
    w_nest_capacity: 1.0
    w_nest_availability: 1.0
    w_end_nest_reachability: 1.0

solver:
    population: 30             # 降种群加速（全因子测试）
    max_iter: 60              # 降迭代加速（全因子测试）
    zeta: 3
    delta: null
    verbose: false
    log_interval: 10

cost:
    dem_step_m: 200.0
    dem_margin_m: 2000.0     # 无 DEM 时此参数不生效
    min_clearance: 50.0
    max_clearance: 300.0
    climb_rate: 0.15
    num_samples: 200
    nest_offset: 1000000

# ── 滚动闭环（多周期持续到达 + 事件注入）────────────────────
rolling:
    n_cycles: 20               # 安全上限；持续到达下不早停
    cycle_length: 600.0
    complete_after_cycle: true
    completion_feasibility_gate: true
    recharge_at_nest: true
    # 持续到达：Poisson 流贯穿全程（本实验要「多周期池非空」）
    arrivals:
        mode: poisson
        lambda: 3.0
    # 到达贯穿全程，早停无意义
    stop_when_stable:
        enabled: false
        patience: 4
    strict_capacity: false
    event_replan: true
    faults: {}
    events:
        enabled: true
        on_uav_fault: true
        on_nest_unavailable: true
        on_urgent_task: true
        reward_threshold: 8.0
        slack_threshold: 900.0

# ── 事件因子注入时刻表（run.py --factor 覆盖此段）─────────────
# E0 无事件 / E1 UAV 故障 / E2 突发高优 / E3 机巢闭塞 / E4 组合
events:
    enabled: true
    on_uav_fault: true
    on_nest_unavailable: true
    on_urgent_task: true
    reward_threshold: 8.0
    slack_threshold: 900.0
    schedule:
        faults: []             # [{cycle: 6, uav: busiest}]
        burst_tasks: []        # [{cycle: 6, n: 2, reward: 9.5, deadline_cycles: 1.0}]
        nest_closures: []      # [{cycle: 6, nest_id: 0}]

run:
    save_results: true
    make_plots: true
    verbose: true

plot:
    formats: [png]
    dpi: 300
