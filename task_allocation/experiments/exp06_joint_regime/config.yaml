# exp06_joint_regime 配置（联合域：K × Poisson 到达压力 × λ_cost 臂）
#
# 论文锚点：§3.5.6 动态滚动场景 + §4 选择层标定的联合域验证。
# 回答 exp01（机多任务少，选择层从未受压）与 exp02（任务压力大但无滚动到达，
# cap(t) 不随时间衰减）都答不了的问题：机队规模 × 任务压力 × Poisson 滚动到达
# 叠加时，分层架构标定结论是否仍成立；并检验「可完成任务最终一定会被完成」
# （用户 2026-10-22 裁定）在积压域是否成立。
#
# 实现方式：本实验不复制滚动外壳，run.py 以 --set 深合并驱动 exp01_smoke/run.py
# （同一 build/horizon/metrics 代码路径，口径逐位继承），只做矩阵编排 + 联合域
# 观测聚合。cap(t)/n_sel/积压等观测量 exp01 per-cycle metrics 已全部落盘
# （cycles[].selection / cycles[].pool_counts），无需新增 instrumentation。

experiment:
    name: exp06_joint_regime
    seeds: [42]              # 首轮单 seed 扫形态（notes.md 建议）；确认无异常后补 43/44

# ── 扫描矩阵 ────────────────────────────────────────────────
# 首轮（2026-10-22 下午）：λ_arrival ∈ {2.5, 5.0, 10.0} × K=10 × λ_cost ∈ {1e-4, 1e-1}
#   λ_arrival=2.5/5.0：供给充足对照（H2：选择数/cap(t)<1，压缩空转）
#   λ_arrival=10.0 ：首轮原计划的「积压格」，但 10 < n_sel=20/周期产能 ⇒ 仍未真积压
# 第二轮（16:1x 起）：λ ∈ {25, 40} 超产能 ⇒ 真正制造积压（H1 考场）
# 最终报告矩阵（--analyze-only 重出）：五档全量 + 两档积压 = 10 格
matrix:
    K: [10]
    arrival_lambda: [2.5, 5.0, 10.0, 25.0, 40.0]
    lambda_cost: [1.0e-4, 1.0e-1]

# ── 场景覆盖（其余全部继承 exp01 生产配置）──────────────────
overrides:
    rolling:
        n_cycles: 24          # 长程吞吐协议（2026-10-14 定）；积压域不会触发收敛早停
        # arrivals.mode/lambda 由矩阵逐格 --set 注入（poisson）
    solver:
        max_generations: 100  # 论文主口径（不用 exp02 轻预算）
    tasks:
        n_tasks: 30           # 周期1 初始任务数，与 exp01 对齐（任务集跨格跨 K 同 seed 一致）

# ── 判定门槛（跑后核对，预注册）────────────────────────────
criteria:
    # 用户假设 1（可完成的一定被完成）的积压域判据：
    assumption1:
        completion_rate_min: 1.0     # 完成率须维持 1.0
        n_eliminated_max: 0          # 淘汰须为 0（淘汰>0 = 机制缺陷：可完成任务未达成）
        # 注意：n_unreachable>0 是物理不可达，合法（与淘汰分账）
    h1_backlog:
        arrival_lambda: 25.0         # 真积压格（到达 ~25 > n_sel=20/周期产能）
    # 2026-10-22 22:xx 实测修正：积压域完成率下降的归因预注册——
    #   arr25 λ=1e-4 格完成率 0.787、淘汰 61，但系统跑满选择配额（468/480=97.5%），
    #   池 30→84 后稳态 ~75 ⇒ 未完成根因是**产能饿死**（到达>名额），非适应度用成本换覆盖
    #   （λ·path 仍仅 m·F1 的 ~1e-3，梯度上不可能弃任务）。
    #   故 λ 决策的判据是**同到达率配对比较**：λ=1e-1 是否比 λ=1e-4 完成率更低/淘汰更多。
    paired_lambda_rule: >
        在积压格（arrival_lambda=25/40）比较 λ_cost=1e-1 与 λ_cost=1e-4：
        若 λ=1e-1 完成率不降、淘汰不增 ⇒ λ=1e-1 在积压域安全，可作生产默认候选；
        若 λ=1e-1 完成率下降或淘汰增多 ⇒ 回退「完成优先 + 较高 λ」结构
        （λ_cost 取仍不击穿完成的最大档，按 Phase 1 证据为 1e-1 附近）。
    fallback_rule: >
        若配对规则判定需回退，λ_cost 往 1e-2 档取仍不击穿完成的最大值。
