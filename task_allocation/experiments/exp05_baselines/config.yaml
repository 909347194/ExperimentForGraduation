# exp05_baselines —— v3「方法主张检验台」（2026-11-09 重新设计）
#
# 设计定稿（冲突以定稿为准）：task_allocation/docs/exp05_redesign_2026-11-09.md
# v3 不再问「我们是否比启发式更好」，而检验五条可证伪主张：
#   C1 完成是硬约束  C2 唯一距离=DEM 有向三维航程、换尺子会改变结论
#   C3 交付解可独立重评  C4 成本对照须与代价并列  C5 组件去留由证据裁决
#
# 场景 / 协议与 exp01 生产口径**逐项相同**；各方法共享同一任务到达序列
# （同 seed 生成）。关键口径：评价端一律 DEM 有向三维航程，与求解端解耦；
# 同一批交付解再用两把尺子各算一次，检验尺子本身是否改变结论。
# 旧 results/ 是 v2 存档（notes 主表与 CSV 批次混拼），不作论文主表数据源。
#
# 参数放置原则（见 experiments/README.md 与 notes.md）：
#   data/        实测事实（机巢经纬度、DEM），跨实验复用
#   config.yaml  本次实验设定（下方每个数值都被 run.py 显式读取）
#   methods/     算法实现，不读配置、不写死数值
# 新增可调项请同步登记 notes.md「参数放哪里」。
# 注释只写当前语义与调法；标定史、实测裁决、清理记录见 notes_archive.md。

experiment:
    name: exp05_baselines
    seed: 42
    # 对照实验协议：≥5 个 seed，报告均值±标准差（notes.md 成功标准）。
    # 任务到达序列由 seed 决定，同 seed 各臂共享，保证逐任务可比。
    seeds: [42, 43, 44, 45, 46]
    output_dir: results_v3 # v3 数值产物；旧 results/ 冻结为 v2 存档，不混用

# ── 对照方法（v3，exp05 专属）────────────────────────────────────
# id → 结果目录名；solver → dmde（本文方法）或 baselines.REGISTRY key；
# cost_model 只作用于**求解端**；评价端一律 DEM 有向三维航程（见 evaluation:）。
# primary=false ⇒ 只进附表，不参与主表配对比较（异口径 / 双因素）。
# pair_with ⇒ 主张报告里的配对对象；solver_budget ⇒ DMDE 预算覆盖。
# 口径提醒：B1/B2 与 M0 是整个第二阶段求解范式的差异，不是单因素；
# D0 是复合档（规划距离 + ETA/时间窗动力学一起换），禁止写成单因素归因。
methods:
    - id: M0
      solver: dmde
      cost_model: dem
      label: 本文完整方法（默认档，主张检验锚点）
      primary: true
      pair_with: null
    - id: D0
      solver: dmde
      cost_model: euclidean
      label: 同架构，把规划用的距离换成平面近似（复合档，不作单因素归因）
      primary: true
      pair_with: M0
    - id: B1
      solver: random
      cost_model: dem
      label: 随机可行分配（下界参照，描述性对照）
      primary: true
      pair_with: M0
    - id: B2
      solver: greedy
      cost_model: dem
      label: 收益/代价比贪心插入（描述性对照）
      primary: true
      pair_with: M0
    - id: Q0
      solver: dmde
      cost_model: dem
      label: 同架构，只压低搜索预算（质量—代价前沿用，小预算档）
      primary: true
      pair_with: M0
      solver_budget: {population: 8, max_iter: 8}
    - id: B3
      solver: vrptw
      cost_model: dem
      label: 硬时间窗插入式（异口径：主动跳过任务，只进附表）
      primary: false
      pair_with: null
    - id: B2e
      solver: greedy
      cost_model: euclidean
      label: 贪心 + 平面近似（距离 × 求解范式双因素，只进附表）
      primary: false
      pair_with: null

# data/<scenario>/ 下的实测与共享数据（跨实验复用，不随实验改）
data:
    scenario: lasa_chengguan # 场景数据目录 data/<scenario>/（新增场景 = 新目录 + 改此键）
    source: file
    path: nest_location_data.csv # 相对 data/<scenario>/
    dem: Chengguan_DEM.tif # 城关区 DEM；不需要高程时置 null
    region_geojson: Chengguan_district.geojson # 任务撒点区域门禁（城关区多边形）
    coordinate_column: Coordinate

# 本实验的问题规模设定（做规模/容量灵敏度改这里，不动数据文件）
problem:
    n_nests: 6 # 用前 6 个机巢（城关区 CSV 共 6 条）
    nest_capacity: 4 # 单机巢容量（架）
    n_uavs: 10 # 机队规模（<= n_nests × nest_capacity 才不初始超容；6×4=24）
    uav_speed: 15.0 # m/s
    uav_max_range: 20000.0 # 满电航程（m）；20 km（城关区口径，与 exp01 一致）
    uav_max_time: null # 最大飞行时间（秒）；null=自动派生 uav_max_range/uav_speed（与航程预算自洽，不新增淘汰）。显式给更小值即成独立绑定约束。

# 合成任务点（暂无实测任务数据；后续换 data/task_location_data.csv 时
# 只需替换生成函数，本节参数可平移）
tasks:
    source: synthetic
    # 撒点域：dem_extent = 在 DEM 有效范围内全域均匀撒点（需求不确定的现实口径，默认）；
    # nest_anchored = 绕机巢 spread_m 半径内撒点（人为缩小问题，仅作消融对照）。
    # 全域撒点后约 30% 任务因违反时间窗而天然不可达（航程 100% 可达），
    # 这是约束的真实选择性压力，见 common/task_scenario.py 模块文档里的实测数据。
    domain: dem_extent
    dem_inset_m: 0.0 # DEM 包络内缩（m）；>0 可避开边缘半像素/插值外推区
    max_reject_trials: 8 # 落点出 DEM 时的拒绝采样重试轮数
    n_tasks: 30 # 第 1 周期到达的初始任务数；后两周期到达 10、20（见 rolling.arrivals），共 60
    spread_m: 12000.0 # 相对锚点机巢的散布半径（m）；仅 domain=nest_anchored 生效
    reward_min: 1.0
    reward_max: 10.0
    # 时间窗改为「周期相关」：latest = 到达时刻 + U(deadline_cycles_min,
    # deadline_cycles_max) × cycle_length，使紧迫度尺度与滚动时域对齐。
    # 不使用周期相关时退回绝对秒数 deadline_min/deadline_max（见 task_scenario.py）。
    #
    # 【domain=dem_extent 后的重新标定】窗口尺度必须与「典型任务航时」同量级，
    # 否则时间窗不是在筛选任务，而是在把大多数任务判成物理上不可能：
    #   全域撒点后到最近机巢中位 17.8 km @ 15 m/s ≈ 1190 s ≈ 2 个周期，
    #   p90 29.5 km ≈ 1970 s ≈ 3.3 周期。
    # 实测 5 seed 扫描（见 results/scan_deadline_cycles/）：
    #   1.5~4.0 周期 (900~2400 s) → 完成率 27.4%±6.3%，淘汰原因 100% miss_time_window
    #   2.5~5.0 周期 (1500~3000)  → 43.2%±7.9%
    #   3.5~7.0 周期 (2100~4200)  → 61.3%±6.2%   ← 当前默认：仍有选择性压力，
    #                                              且不至于让多数任务先天不可达
    #   5.0~10.0 周期(3000~6000)  → 66.7%±7.1%（接近锚定机巢基线的 68.2%，此时时间窗基本失效）
    # 锚定机巢基线的 68.2% 是「人为缩小问题」的上限，不作为目标值。
    #
    # 【统一 DEM 三维航程口径后的重新标定】
    # 距离口径统一后（评价端/ETA/时间窗全部走 DEM 垂直切面三维航程，见
    # methods/muas/cost/vertical_section.py），旧窗口 3.5~7.0 完成率跌至 75%：
    # 20 个任务直飞全部来得及（物理不可达=0），但 ETA 变长使多任务航次后段
    # 任务迟到回池，下周期余量不足直飞时间即被预筛淘汰（链式死亡）。
    # 按实测航时重算（seed=42，最近机巢直飞 DEM 航程 @15 m/s）：
    #   中位 1377 s ≈ 2.29 周期；p90 ≈ 3.2 周期；最大 2274 s ≈ 3.79 周期（T10）
    # 下界 = (最大直飞航时 + 服务 300 s) × 1.05 ≈ 2703 s ≈ 4.5 周期，
    # 上界保持原 2:1 比例 → 9.0 周期。实测扫描（统一口径，seed=42）：
    #   3.5~7.0 → 75%（15/20，未完成 0/7/10/15/19）
    #   4.2~8.4 → 95%（19/20）
    #   4.5~9.0 → 95%（19/20）  ← 当前默认：4.2~9.0 区间完成率平台期，
    #                                  任取其中值均可；保留选择性压力（仍有淘汰）
    #   5.0~10.0 → 100% 但零淘汰（时间窗失效），代价 +16%、求解 +57%，不取
    deadline_cycles_min: 4.5
    deadline_cycles_max: 9.0
    anchor_to_nests: true # 遗留别名，仅 domain=nest_anchored 时生效

# 算法开关（对齐 Chapter3_README §8 技术路线）
method:
    selection: marginal_gain
    muas: dmde
    rolling: true

# ── 第一阶段：动态任务选择（论文 §3）──────────────────────────────
selection:
    alpha: 2.5 # 候选数的机数倍率：n_cand = ⌈α·K⌉（K=可用机数）
    weights: # 基础优先级 P_i(t) 的五项权重（自动归一化）
        w_r: 0.30 # 任务收益
        w_u: 0.25 # 时间紧迫度
        w_w: 0.15 # 等待补偿
        w_s: 0.15 # 空间协同增益
        w_c: 0.15 # 执行代价（负号项）
    synergy_radius: 5000.0 # 空间协同的作用半径（m）
    wait_scale: 3600.0 # 等待补偿的时间尺度（s）
    feasibility:
        # 往返口径的航程裕度：2×单程 ≤ margin×剩余航程。1.0 = 物理上限，
        # 与完成闸门 check_range_constraint(margin=1.0) 同口径——T105/T119
        # 往返 78.5/77.0km 的单任务航次实证可服（est_cost 79765m ≤ 80km）。
        # 旧单程口径的 0.95 等效 76km 单程，直接迁到往返口径会把可达半径
        # 腰斩到 38km 误杀远站任务，故置 1.0；<1 仅消融。
        range_margin: 1.0
        # 时间窗预筛：默认关闭（迟到是奖励定价问题，不是参选资格；
        # 预筛只拦物理不可达）。true = 消融口径（配 late_tolerance_seconds）。
        check_time_window: false
        budget_factor: 1.0 # 机群总航程预算系数
        # 消融口径专用（check_time_window=true 时生效）：迟到容忍 W（s）。
        # 0 = 历史口径（直飞到达 > latest 即拒）；须与 muas.late_reward_decay_seconds 同值。
        late_tolerance_seconds: 1800.0
    marginal:
        eps: 1.0 # 边际代价地板，与距离同量纲（m）
        max_selected: null # null → 由 max_ratio × K 决定（n_sel = ⌈max_ratio·K⌉）
        max_ratio: 2.0
        min_marginal_ratio: 0.0
        # 防饥饿软加权：eff = ratio·(1 + age_gamma·age)，age∈[0,1] 由
        # waited/wait_scale 得；刚老的任务终刀更有机会，老透/临期由
        # anti_starvation 强制纳入。
        age_gamma: 1.0
        wait_scale: 3600.0 # 与 priority.wait_scale 对齐（run() 会同步）
    capability:
        enabled: true # false → 退回纯机数名额（消融对照口径）
        # 机数名额与能力上界 cap(t) 的合成：
        #   intersect（默认）min{名额, cap(t)}——能力只能收紧
        #   primary          cap(t) 为主、名额兜底（紧张收编、充裕可超名额）
        mode: intersect
        max_expand_factor: null # 仅 mode=primary 生效：相对机数名额的最大扩张倍数
        budget_scale: 1.0 # 预算额外折扣（与 budget_factor 相乘）
        quantile: 0.5 # 粗代价分位数：低→cap 宽松，高→保守
        min_cap: 1 # cap 下限（保证总能评出一个候选）
        fallback_when_disabled: false # true=即便 enabled=false 也按吞吐上界收敛候选规模
    # 防饥饿强制：等待超阈值或逼近 latest 的任务强制纳入候选（绕过 Top-αK
    # 预筛）并在终刀获强优先，保证不无限期推迟。
    anti_starvation:
        enabled: true
        force_after_seconds: 1200.0 # 等待满 2 周期（2×cycle_length）即强制纳入
        deadline_slack: 300.0 # 距 latest 不足 300s 即视为临期、强制纳入

# ── 第二阶段：选择性多机巢 MUAS（论文 §4-§5）─────────────────────
muas:
    # 覆盖门禁审计分账：定稿 §4.3 要求开；生产默认 True。
    # v3 显式写出，避免实验自持装配层默认值漂移把它静默关掉。
    coverage_audit: true
    allow_unassigned: true # 允许 y_j = 0（任务保留至下一周期）
    allow_idle_uav: true # 允许 n_u = 0（UAV 本周期空闲）
    # 适应度口径：覆盖门禁（唯一主口径）。big_m 仅作 W_hard/
    # W_skip 推导基数（κ·m·R_pool），不再进 f 的 −m·F1 项；非门禁 big-M
    # 四层路径已从代码移除（见 docs/objective_caliber_two_approaches_archive_2026-10-24.md）。
    # big_m: null → 按问题数据自动推导；给数值则显式固定。
    # 经济剔除是消融算子，默认关闭，见下方 prune_unprofitable。
    big_m: null
    # 按口径约定统一为 1e-1，与 exp01 现行值一致；
    # 改前为 1e-2（原生产默认）。本轮全实验同口径，结果可进同一张主表。
    lambda_cost: 1.0e-1 # 次目标权重（收益当量/米）；字典序下只裁决收益等价的解
    # 口径约定：生产默认 1e-4 → 1e-2（与 exp01 主口径同步；1e-1 = 敏感性上界）
    w_penalty: 1.0 # 约束违反惩罚总权重（历史口径：惩罚随 F2 一起乘 λ）
    # 惩罚量纲解耦：null = 惩罚进 F2 再乘 λ；给数值则以「奖励当量/惩罚单位」
    # 直接计入、不乘 λ（如 0.01 ⇒ 迟到 300s ≈ 3 点奖励）。
    w_violation: 0.01
    w_nest_capacity: 1.0 # 机巢容量违反的惩罚权重
    # ── 四层准字典序 T0 层────────────────────────────
    # f = W_hard·n_hard + w_exc·excess_m − m·F1_eff + w_late·L_tot + λ·path
    #   T0 物理违约（硬）：range/endurance/时序/同步/巢容量/终点不可达/结构。
    #     任何一次违约压倒任意交付收益——「纸面可行、执行弹回」的幽灵 F1
    #     永不入选（旧口径 misc×1e3×wv 只折 10 单位，而单任务收益 m·R≈2.7e5）。
    #   w_hard_violation: null = 自动 κ·m·R_pool（κ 见下）；显式值固定权重；
    #     0 = 关闭 T0 层（消融对照：退回旧混合 penalty 口径）。
    #   w_range_excess:   null = 自动 1/m（1km 超程≈1000 单位，仅在不可行
    #     解之间做层内排序，永远翻不了记账）。
    w_hard_violation: null
    w_range_excess: null
    hard_violation_kappa: 10.0 # W_hard = κ·m·R_pool 的安全系数
    # 迟到奖励折减容忍 W（s）：eff = R × max(0, 1 − L/W)。迟到不是废飞——
    # 仍算完成、计奖励，按时长折减。须与 selection.feasibility.late_tolerance_seconds
    # 同值；null = 关闭折减。标定依据见 notes_archive.md「config 注释精简留档」。
    late_reward_decay_seconds: 1800.0
    default_service_time: 60.0 # 单任务作业时长（s）
    max_participating_uavs: null # 参与规划的 UAV 上限；null → min(K, N-1)（srp 巡游模型）
    participating_policy: demand # cheapest | first | marginal | demand
    # ── ③需求感知参与（policy=demand）──
    # 贪心最大覆盖选参与机：依次挑「覆盖最多未覆盖任务」的机，直到选中
    # 任务全被覆盖或达 K 上限（治 cheapest 把机堆在稠密区、饿死离群任务）。
    demand_coverage_radius: null # 显式覆盖半径（m）；null → 用航程因子推导
    demand_range_factor: 0.5 # 半径 = factor·remaining_range（0.5 = 单任务往返的保守可达）
    # 服务能力感知补机：最小覆盖后按航程预算把过载任务剥给最近空闲机并
    # 拉入参与（救「K 塌缩 → 远任务未服务」的残余瓶颈）。
    demand_provision_serving: true
    demand_serve_margin: 0.95
    # 「可达即执行」救援池：任务只要能力可达就应最终被执行。可达 = 存在
    # 量化（∃ 机队中某方案可服务），不限「给定参与集内塞得进」。
    #   fleet（默认）：救援池 = 全可用机队；participating：仅参与集（消融）。
    reflow_rescue_scope: fleet # fleet | participating
    # ── K 决策扩展旋钮（实验/消融用；均不配置时 K = min(可用机数, N-1)）──
    sortie_budget: null # 本周期出动架次硬上限 S_t；null = 不设
    # 每架固定出动代价 γ（起降/能耗/架次占用）；仅 participating_policy=marginal
    # 生效：γ=0 不早停；γ>0 新增机覆盖代价下降 ≤ γ 即停。
    participation_cost: 0.0
    # 估计器单机服务容量（一次出动最多串几个任务）；null = 按航程自动推导
    # cap = max(1, ⌊min 剩余航程/平均单程代价⌋ − 1)；给整数则固定（消融）。
    marginal_tour_cap: null
    prune_unprofitable: false # 与「完成是约束」冲突，门禁口径下必须关
    prune_margin: 0.0 # 剔除判据裕度：λ·节省 > R·(1+margin) 才剔除
    prune_max_rounds: 8
    # 零奖励剔除：ETA ≥ latest+W 的任务 eff≈0，暂缓把机会留给下周期。
    # 仅 late_reward_decay_seconds>0 时生效。消融实测见 notes_archive.md。
    prune_zero_reward: false
    prune_wait_bonus: 1.0 # 等待补偿：滞留越久有效收益越高，越难被剔除
    wait_scale: 3600.0 # 等待补偿的时间尺度（s）
    # ── ⑤Lamarckian 回写：把修复后解的起始任务归属写回获胜个体基因，
    # 使后继代际围绕修复后的可行子空间展开。终点机巢不进编码（方案 A），
    # 由解码后内层最小费用流精确求解。
    lamarckian: true
    # 解码后局部搜索 polish：DMDE 收敛后对 best_assignment 做
    # relocate/swap/插入位搜索，候选过同一 build_solution 修复链，仅严格
    # 改进才接受（治收敛后路由改善不可见的问题，详见 notes_archive.md）。
    polish_enabled: true
    polish_moves: [relocate, swap, position] # 扫描优先级：结构性收益最大的排首
    polish_max_rounds: 30   # 无改进即停的轮数上限
    polish_max_evals: 2000  # 真实评估数预算（缓存命中不计；防单周期耗时爆炸）
    polish_eps: 1.0e-6      # 严格改进阈值（绝对；吸收浮点求和噪声）
    # memetic M1 精英档案：开启后每 memetic_K 代在 DE 进化
    # 循环内对当代精英跑一次 polish，维护 best-polished 档案，把路由改进
    # 前移进搜索期（治 DMDE 早平后路由优化留到收敛后）。不改基因型、无
    # 反映射；交付解取「收敛后 polish」与「档案最优」的更优者。默认关
    # （非 memetic 基线不动）；exp01 memetic 变体显式开此二项。
    # M2（Lamarckian 反射写回）见报告「讨论与展望」，暂不启用。
    polish_in_loop: false
    memetic_K: 20           # 每 K 代触发一次精英 polish（>=1）
    memetic_max_rounds: 6   # 搜索期内强化的从紧轮数预算（first-improvement 早停）
    memetic_max_evals: 500  # 搜索期内强化的从紧评估预算（控单周期耗时）

# ── 约束开关（实验可配置：每类约束独立开关 + 独立惩罚权重）─────────
# 置 false → 该约束既不参与可行性判定、也不计入惩罚，用于消融对比与
# 论文口径取舍（例如「本模型暂不纳入交付时间窗」只需把 time_window 改 false）。
# 与 selection.feasibility.check_time_window 联动：关闭 time_window 时，
# 第一阶段的时间窗预筛同步关闭，保证两阶段口径一致。
constraints:
    # 结构类
    duplicate_task: true # 任务重复分配 / 未知任务 / sum_u x_uj = y_j
    require_all_tasks: true # allow_unassigned=false 时禁止 y_j=0
    require_no_idle: true # allow_idle_uav=false 时禁止空闲机
    # 单机（飞行安全类，建议常开）
    range: true # 航程
    endurance: true # 飞行时间 / 续航
    # 协同
    time_window: true # 交付时间窗（关 = 模型暂不纳入；两阶段同步生效）
    sequence: true # 时序 / 前置依赖
    sync: true # 同时到达
    # 机巢
    nest_capacity: true # 容量
    nest_availability: true # 可用性 / 存在性
    end_nest_reachability: true # 末任务 → 终点机巢可达性（地形遮挡 / 禁飞）
    # 惩罚权重（仅对已启用的约束生效）
    w_misc: 1.0
    w_range: 1.0
    w_endurance: 1.0
    w_window: 1.0
    w_seq: 1.0
    w_sync: 1.0
    w_nest_capacity: 1.0
    w_nest_availability: 1.0
    w_end_nest_reachability: 1.0

# ── DMDE 求解器超参（论文 §5 算法 3.1）────────────────────────────
solver:
    population: 50 # pop_size（默认：论文实验配置）
    # max_generations：500（由 100 上调，依据 Ming et al. 2017 标定）：
    #   ① 原文 pop50/gen1000、Fig.10 自述约 150 代收敛；本实现反映射温度
    #      temperature = 1 - gen/Gen，随机匹配预算 = 0.9×Gen，100 代时仅 90 代
    #      （原文 900 代），探索代数差一个量级；
    #   ② 实测对照（同实例同种子，verify 实验）：500 代把 path 从 485 km 压到
    #      381 km（-105 km）——100 代未收敛，仍有可测余量；且周期 1 的 T9→UAV4
    #      更优解在 100 代下从未命中（4 个求解器种子全部 miss），500 代是治
    #      「人为依赖 miss」的预算侧前提（配合 --seeds 统计协议）。
    # 代价：单周期求解耗时约 ×5（exp01 单 seed 全程约 80s → 约 7min）；
    # 调试时可临时调回 100 或配合 --no-plots。
    max_iter: 100 # max_generations（论文主口径；500代对照见敏感性分析）
    zeta: 3 # 动态交叉率曲率指数 ζ（论文式 3-9 取 3）
    # 灭绝门限 δ：null = 论文式 3-12 原式 GMR = 1 − CR；填数值（如 0.3）
    # 则附加工程门限 CR>=δ 时不灭绝。
    delta: null
    seed: 42
    verbose: false
    log_interval: 10

# ── 三维地理代价（论文 §5(5)）─────────────────────────────────────
cost:
    dem_step_m: 200.0 # DEM 重采样网格间距（m），越小越精细越慢
    # 网格范围相对「机巢包围盒 ∪ 任务域包络」的外扩（m）。
    # tasks.domain=dem_extent 时任务恒在 DEM 包络内，20 km 外扩已无必要，
    # 只留 2 km 插值光环即可（网格从 108×127 km 降到 102×115 km，更快）。
    dem_margin_m: 2000.0
    min_clearance: 50.0 # 最小离地余量（m）
    max_clearance: 300.0 # 巡航离地高度上限（m）
    climb_rate: 0.15 # 爬升/下降斜率（相对水平距离）
    num_samples: 200 # 单条垂直切面采样点数
    nest_offset: 1000000 # 机巢在代价键空间的偏移量

# ── 动态滚动闭环（论文 §6）───────────────────────────────────────
rolling:
    enabled: true
    # 长程吞吐协议（用户定）：完成率不是目标，周期可无限延长，
    # 真实目标 = 持续到达下「尽可能多且正确地完成任务」。3 周期窗口的完成率
    # 只是窗口长度产物，无区分度；24 周期 + Poisson 到达流下，吞吐 / 正确
    # 执行率 / 违约交付（废飞）/ 淘汰（须为 0）才有统计意义。
    n_cycles: 60 # 安全上限（周期数本身不定）；真实停止由 stop_when_stable 收敛早停决定
    cycle_length: 600.0 # 每周期推进的时间（s）
    complete_after_cycle: true # 周期末把执行中的任务判为完成
    # 完成反馈可行性闸门（论文 §6）：true = 被判违约的任务不顺延完成
    # （解绑回池、下周期重选，记入 infeasible_ids），完成率不说谎；
    # false = 历史行为（一律标完成），消融对比用。
    completion_feasibility_gate: true
    recharge_at_nest: true # 降落后机巢换电，剩余航程回满
    # 动态到达过程（论文 §6「动态任务到达」）：第 2 周期起每周期的新到达任务数。
    # mode=poisson  → 每周期 Poisson(λ) 个（真实随机流，体现动态性）
    # mode=uniform  → 每周期 U[low, high] 个
    # mode=fixed    → 用固定列表 counts（向后兼容旧配置写法）
    # 随机流以 experiment.seeds 中对应 seed 为种子，同配置可复现。
    # 注意：fixed 的 counts 长度必须 = n_cycles-1，否则延长周期只补 0 到达空转；
    # 长程协议必须用 poisson/uniform 才有「持续到达」。
    arrivals:
        mode: fixed # 确定性到达：周期2到达10、周期3到达20（周期1初始=30，共60）；周期4起补0无新到达
        counts: [10, 20]
    # 收敛早停（口径约定，与 exp01 同步；审查 M2
    # 修正旧注释）：主判据是「池空」——到达全部注入后，池内不存在
    # 「能被完成却没被完成」的任务即自然收敛停机（stop_reason=pool_empty）；
    # 静态几何不可达已出池，服务暂缓（DORMANT）任务仍在池中等条件恢复唤醒，
    # 故池非空时持续推进（「没服务，只要能服务，迟早被服务」）。
    # stable_patience 降为兜底：仅当池非空、池内无服务暂缓任务且连续该数个
    # 周期零进展才提前停（stop_reason=no_progress，属非自然收敛，须与
    # n_dormant_end 等单列指标并读）。兜底只覆盖无服务暂缓任务的僵死池
    # （如能力短缺反复装不下）；服务暂缓任务在池时忠实「一直下去」，
    # 由 n_cycles 硬上限止损。n_cycles 仅为硬安全上限，不是主停机条件。
    stop_when_stable:
        enabled: true
        patience: 4
    strict_capacity: false # true → 落地期超容直接抛异常（调试用）
    # 事件驱动本期重规划（论文 §6）：UAV 故障 / 突发高优先级任务 / 机巢
    # 不可用时本周期内反应式调整；false = 事件仅记录不重规划（消融）。
    event_replan: true
    faults: {} # 故障注入：{周期号: [uav_id, ...]}，验证 T_t^release 链路
    events:
        enabled: true # 总开关：false 则完全不做事件检测
        on_uav_fault: true
        on_nest_unavailable: true
        on_urgent_task: true
        reward_threshold: 8.0
        slack_threshold: 900.0

run:
    save_results: true
    make_plots: true
    verbose: true

# ── v3 统一事后评价器（docs/exp05_redesign_2026-11-09.md §4）──────
# 评价端与求解端解耦：所有方法的交付解一律按 DEM 有向三维航程重评，
# 再用两把尺子各算一次，检验「换尺子是否改变方法间结论」（C2 主证据）。
# profile 只作落盘标签；冒烟/mid 结论不可外推正式档，正式档须单独跑批。
evaluation:
    two_rulers: true           # 同一批交付解：d_DEM 有向 vs d_euclid3d
    independent_audit: true    # 逐周期几何重建重评（零生产改动的运行期包装）
    distance_definition: dem_vertical_section_3d
    comparator_ruler: euclidean_3d
    coordinate_precision: full # 落盘坐标不 round（铁律：离散包络查询）
    #（清理2026-11-11：原 audit_failure_policy 键无代码消费，已删；行为固定在
    #  代码里：审计 FAIL 只记账、不中断，先怀疑实现缺陷）
    profile: formal            # smoke | mid | formal；跑冒烟时 --set evaluation.profile=smoke

# ── v3 主张检验（seed 单源 = experiment.seeds，勿在此重复写 seeds）──
# primary_methods 决定第 0 层门槛对谁强制；未通过者单列归因，不静默删除。
claims:
    primary_methods: [M0, D0, B1, B2, Q0]
    alpha: 0.05
    min_abs_dz: 0.5
    #（内容键：以下两项是预注册告示/证据索引文本，不参与装配——勿按死键清理）
    multiple_comparison_note: 名义 p 值，未做多重比较校正；禁从多指标里挑显著项当主结论
    evidence_index: task_allocation/docs/stage2_final_scheme_2026-11-06.md §11.8-§11.12

# ── 可视化：v3 主表由 claims_report.json / summary_primary.csv 单源生成；
#    notes.md 只引用不抄数。论文插图待正式档定稿后按 experiments/README.md 补。
