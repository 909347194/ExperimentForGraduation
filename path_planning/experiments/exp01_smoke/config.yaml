# exp01_smoke —— 整城全链路验证（第4章 B 路线：可见性图 / 稀疏路图）
# 单一配置：默认整城（scenario.crop: full）。想快速冒烟：
#   --set scenario.crop=auto --set visibility_graph.max_nodes=4000
# 注意：整城建图成本随建筑数放大，max_nodes 必须足够大（否则节点被截断 → 图覆盖不全、大量 OD 不可达）。

scenario:
  id: guangzhou
  dir: data/raw/guangzhou
  classes: [Residential, Commercial, TechnologyIndustry, PublicServices, EducationalCultural]
  # 裁剪窗口（三态）：
  #   full / none   = 整城不裁剪（默认）
  #   auto          = 自动选建筑最密的 600m 窗口（秒级，用于快速冒烟）
  #   [x0,y0,x1,y1] = 固定窗口
  crop: full
  crop_size: 600.0      # auto 模式的窗口边长（米）
  # 仅作用于 auto / 显式窗口（crop: full 走不裁剪分支，直接忽略本项）：
  # 窗口内超限栋时保留离中心最近的 N 栋。不要设 null——整栋保留会把 max_nodes 预算
  # 吃光，导致大片区域无节点可接 → 大量 ORIGIN_UNREACHABLE。
  max_buildings: 350
  min_building_area: 1.0

# 可见性图 / 稀疏路图参数（path_planning/methods/visibility_graph/params.py）
# 键名与 VisibilityGraphParams 严格一致，写错会启动即报错（不静默用默认值）。
visibility_graph:
  simplify_mode: simplify     # simplify | convex_hull | oriented_bbox | axis_align
  simplify_tol: 3.0          # Douglas-Peucker 容差（米）
  d_build: 5.0               # 建筑外扩安全距离（安全净空下限）
  node_step: 40.0            # 建筑外轮廓采样步长（米）
  node_buffer: 5.0           # 节点相对建筑轮廓的安全距离
  altitude_layers: [20.0, 50.0]   # 离散飞行高度层
  grid_step: 100.0           # 自由空间粗网格步长（连通性骨干）
  grid_layers: [20.0, 50.0]
  max_nodes_per_building: 8
  max_nodes: 1000000         # 整城不截断（全量建筑+网格节点约 10–20 万）
  max_edge_len: 220.0        # 最大连线距离（米）
  edge_margin: 2.0           # LOS 判定额外余量
  max_degree: 40             # 每点最多保留 K 个最近候选
  connect_layers: true        # 同 (x,y) 不同高度层间加竖向边
  protection_clearance: 0.0   # 机动保护区：关掉（d_build 已含安全净空；8m 会把密集区边一刀切删光致不连通）
  attach_radius: 90.0         # OD 接入半径（米）
  include_dynamic_as_static: false   # 选项 A：动态禁飞仅查询期按时间窗检查（图建一次复用）
  cruise_speed_mps: 15.0      # 路径长度→到达时刻换算速度（动态禁飞时间窗判定用）

# 整城粗网格演示（run.py --full-city 触发，秒级出 fig_full_city_3od.png）
#   为什么单独一套参数：把 max_nodes 压到 1 → 跳过全部 20655 栋建筑壳节点的逐栋 buffer
#   （那才是 21min 建图的真正瓶颈）→ 纯网格图，建图 ~8s。代价是路径只绕开建筑本体、
#   不带常规飞行余量，属**示意性全城图**，不是交付用的精细图
#   （精细全图见 exp02_vg 的 104k 节点验证）。
full_city_viz:
  z: 20.0               # 跨城 OD 飞行高度（单层）
  depart_time: 10000.0  # 起飞时刻：远晚于动态禁飞时段 → 验证"空闲窗"口径，路径干净
  # 覆盖 visibility_graph 的粗网格参数（键名与 VisibilityGraphParams 一致，写错会报错）
  graph:
    max_nodes: 1              # 预算封顶 0 → 跳过建筑壳节点
    grid_step: 50.0           # 全城网格≈9300 点（覆盖 23.23 km²）
    grid_layers: [20.0]
    altitude_layers: [20.0]
    max_edge_len: 90.0        # 50m 网格的 8 邻点对角≈71m，必须 >71 才连通
    max_degree: 20
    protection_clearance: 0.0 # 关机动保护区，保连通
    d_build: 3.0              # 建筑外扩 5→3m（边仅穿入本体才剪）
    edge_margin: 0.0
    connect_layers: true

# TPR 本阶段不启用（论文保留章节，代码不实现）
risk:
  lambda_r: 0.0
  enabled: false

nofly:
  # file      = 读 <dir>/nofly_static.geojson + <dir>/nofly_dynamic.geojson（真实数据）
  # synthetic = 用敏感设施位置合成动态禁飞区（无真实数据时的过渡方案）
  # none      = 不加载任何禁飞区（纯方法基线对照）
  source: synthetic
  # 禁飞区文件目录（真实数据用 data/raw）
  dir: data/raw
  synthetic:
    n: 1                # 整城用 1 个即可
    radius: 40.0        # m（禁飞区半边长）
    t_start: 0.0        # s（与 OD 出发时刻一致，保证动态时间窗判定被触发）
    duration: 400.0     # s
    z_top: 60.0         # m（禁飞高度上限；超过节点高度则只能绕行、不能飞越）
    gap: 120.0          # s
    seed: 42
    source_classes: [PublicServices, EducationalCultural]

od:
  # auto = 在裁剪窗口内自动取 OD；也可给固定列表 [[x,y,z], [x,y,z]]
  mode: auto
  n_pairs: 4
  z: 20.0               # 起终点飞行高度 m
  seed: 7
  pairs: []

checks:
  enable_unit_checks: true      # 专项用例（建筑阻挡 / 动态时间窗）
  enable_path_audit: true       # 平滑后路径独立复核（建筑 + 静态/动态禁飞）
  audit_step_m: 2.0
  edge_case_t_offset: -30.0     # "擦边"用例：相对禁飞生效时刻的起飞偏移 s
