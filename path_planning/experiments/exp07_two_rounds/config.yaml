# exp07_two_rounds —— 单机**两轮链式**航迹：轮1 巢0 → 任务 A（停在任务点），
# 轮2 从轮1 的末位置、末时刻续飞 → 任务 B（停在任务点）。
# 它验的是"分段独立求解"：上一轮输出（末位置/末速度/末时刻）能否原样接进下一轮请求，
# 两轮的 leg 质量账与串联处的连续性是否都对得上。不接上层决策周期，轮次是离线串的。
#
# 这份文件是本实验**唯一**的参数来源：不继承、不覆盖、不设代码默认值。
# 起终点不在本文件里——它们在 ``rounds.json``（与 exp05 的 tours 同理：点属清单，参数属配置）。
#
# 运行（项目根下）：
#   $env:PYTHONPATH="."
#   & ".\.venv\Scripts\python.exe" -m path_planning.experiments.exp07_two_rounds.run
#   & ".\.venv\Scripts\python.exe" -m path_planning.experiments.exp07_two_rounds.audit

experiment:
  name: exp07_two_rounds
  seeds: [0]

scenario:
  data_dir: path_planning/data/guangzhou
  name: guangzhou
  nest_count: null          # null = 全部机巢（当前 3 个）
  terrain_step_m: 30.0
  bbox_margin_m: 5.0

field:
  spacing_m: [4.0, 4.0, 2.0]   # 与 sdf_spacing_cells 对齐：全网格距即最细格距
  agl_min_m: 0.0
  agl_max_m: 120.0
  pad_m: 0.0
  include_static_nofly: true
  sample_bias_m: 0.0
  cache_dir: path_planning/experiments/.cache

corridor:
  half_width_m: null          # 不给具体半宽 → 按宽比算
  width_ratio: 0.10           # 与 exp05 同口径：2.1 km 航段 → 半宽 ~106 m
  margin_m: 10.0

runtime:
  agl_range_m: [3.0, 100.0]   # RRT 真高带（与建场带同源，取建场带内的可飞部分）
  endpoint_clearance_m: 2.0   # 机巢 SDF 实测 +1.63 / −0.63 / +1.47，圈内必须放宽
  endpoint_exempt_radius_m: 25.0
  e_geo_m: 0.5                # 检测半径的几何误差标量（DEM 像元/棱柱化/AGL 舍入）
  takeoff_agl_m: 8.0          # 轮1 起点 z = 机巢地面 + 8 m
  results_dir: path_planning/experiments/exp07_two_rounds/results

planning:
  clearance_m: 6.0
  corridor_half_width_m: 20.0     # 只用于参数自洽校验；实际半宽由 corridor 段给
  grid_cell_m: 60.0
  sdf_spacing_cells: [4, 4, 2]
  bbox_margin_m: 5.0

  rrt_step_m: 30.0
  rrt_min_step_m: 10.0
  rrt_sdf_step_scale: 0.5
  rrt_max_iters: 3000
  rrt_goal_sample_rate: 0.1
  rrt_shortcut_iters: 200
  rrt_initializations: 5
  rrt_dedup_tol_m: 8.0
  clearance_sample_step_m: 2.0

  n_nodes: 120          # 2.1/1.3 km 航段下节点间距 ~18/11 m
  dt_min_s: 0.3
  dt_max_s: 20.0
  max_iter: 400
  solver_tol: 0.0001
  clearance_samples_per_segment: 8
  arc_subintervals: 8
  gauss_points: 2

  eps_a_m: 0.05
  time_eps_s: 0.001
  space_eps_m: 0.001
  ellipsoid_semiaxes_m: [30.0, 30.0, 15.0]
  cpa_dense_steps: 24

  local_region_margin_m: 100.0
  max_replan_rounds: 3
  retreat_node_ladder: [40, 30]
  solve_budget_multiplier: 3.0
  detour_vertical_steps_m: [8.0, 16.0, 24.0]
  detour_lateral_steps_m: [12.0, 24.0, 36.0]
  local_replan_clearance_fix_m: 2.0
  local_replan_guide_radius_m: 2.0

  hover_weight: 1.0
