  </g>
  <text x="82" y="34" fill="#2C2C2A">基地</text>
  <g transform="translate(152 30)" stroke="#2F4F6F" stroke-width="1">
    <path d="M-3 -2L-7 -5M3 -2L7 -5M-3 2L-7 5M3 2L7 5"/>
    <ellipse cx="-7" cy="-5" rx="3.5" ry="1.8" fill="#C6DFF3" stroke="#185FA5" stroke-width="0.6"/>
    <ellipse cx="7" cy="-5" rx="3.5" ry="1.8" fill="#C6DFF3" stroke="#185FA5" stroke-width="0.6"/>
    <ellipse cx="-7" cy="5" rx="3.5" ry="1.8" fill="#C6DFF3" stroke="#185FA5" stroke-width="0.6"/>
    <ellipse cx="7" cy="5" rx="3.5" ry="1.8" fill="#C6DFF3" stroke="#185FA5" stroke-width="0.6"/>
    <rect x="-4.5" y="-3" width="9" height="6" rx="2.5" fill="#2F4F6F" stroke="#173247" stroke-width="0.6"/>
  </g>
  <text x="176" y="34" fill="#2C2C2A">无人机</text>
  <line x1="236" y1="30" x2="266" y2="30" stroke="#185FA5" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="274" y="34" fill="#042C53">已派航次</text>
  <ellipse cx="435" cy="30" rx="10" ry="5" fill="#F09595" fill-opacity="0.5" stroke="#A32D2D" stroke-width="0.8" stroke-dasharray="3 2"/>
  <text x="450" y="34" fill="#791F1F">禁飞区</text>
  <line x1="560" y1="30" x2="585" y2="30" stroke="#C2571A" stroke-width="1.5" marker-start="url(#arrowOrange)" marker-end="url(#arrowOrange)"/>
  <text x="592" y="34" fill="#8A3D0F">安全间距</text>

  <text x="60" y="62" fill="#2C2C2A">任务状态</text>
  <g transform="translate(140 58)"><path d="M0 0L0 -14" stroke="#3B6D11" fill="none"/><path d="M0 -14L11 -10.5L0 -7Z" fill="#97C459" stroke="#3B6D11" stroke-width="0.7"/></g>
  <text x="150" y="62" fill="#27500A">完成</text>
  <g transform="translate(205 58)"><path d="M0 0L0 -14" stroke="#185FA5" fill="none"/><path d="M0 -14L11 -10.5L0 -7Z" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.7"/></g>
  <text x="215" y="62" fill="#042C53">执行中</text>
  <g transform="translate(280 58)"><path d="M0 0L0 -14" stroke="#A86C00" fill="none"/><path d="M0 -14L11 -10.5L0 -7Z" fill="#F2C25E" stroke="#A86C00" stroke-width="0.7"/></g>
  <text x="290" y="62" fill="#6B4700">待分配</text>
  <g transform="translate(355 58)"><path d="M0 0L0 -14" stroke="#A32D2D" fill="none"/><path d="M0 -14L11 -10.5L0 -7Z" fill="#F09595" stroke="#A32D2D" stroke-width="0.7"/></g>
  <text x="365" y="62" fill="#791F1F">不可达</text>
  <line x1="430" y1="58" x2="458" y2="58" stroke="#5F5E5A" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>
  <text x="464" y="62" fill="#5F5E5A">任务到达</text>
</g>

<!-- 透视网格地面 -->
<path d="M50 315L340 95L670 245L370 435Z" fill="#F1EFE8" fill-opacity="0.55" stroke="#B4B2A9" stroke-width="0.8"/>
