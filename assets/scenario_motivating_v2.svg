<svg width="100%" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>城市低空多基地协同调度场景示意图（v2）</title>
<desc>城市低空场景：三个基地、建筑群与禁飞区；任务持续到达（虚线箭头指向新到达任务 T7）。三条跨基地航次每条都服务任务：U1 自 B1 依次访问 T1、T2（绕开建筑，标注出发与到达时刻）后落 B3；U2 自 B2 访问 T3 后落 B3；U3 自 B3 访问 T4 后落 B2。U2 与 U3 航迹间保持最小安全间距，体现带时间的无碰撞轨迹。</desc>
<defs>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#C2571A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- 图例 -->
<g font-family="var(--font-sans)" font-size="12">
